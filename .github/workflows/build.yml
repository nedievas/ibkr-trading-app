name: Build

on:
  push:
    branches: [main, fix/stability-review]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'release' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            libvulkan-dev vulkan-validationlayers \
            libglfw3-dev \
            libprotobuf-dev protobuf-compiler \
            libgl1-mesa-dev

      - name: Regenerate protobuf sources
        run: |
          # The vendored IB API is committed as source; the generated protobuf is
          # regenerated here so it matches this runner's libprotobuf (Ubuntu).
          PROTO_SRC="vendor/twsapi/IBJts/source/proto"
          PROTO_OUT="vendor/twsapi/IBJts/source/cppclient/client/protobufUnix"
          mkdir -p "$PROTO_OUT"
          protoc --proto_path="$PROTO_SRC" --cpp_out="$PROTO_OUT" "$PROTO_SRC"/*.proto

      - name: Cache build dependencies (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: linux-deps-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: linux-deps-

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DIBKR_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Install (binary + assets/) to dist/
        run: cmake --install build --prefix dist

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' || github.ref_name == 'fix/stability-review' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ibkr-trading-app-linux
          path: dist/
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'release' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake glfw protobuf@21 vulkan-headers vulkan-loader molten-vk

      - name: Regenerate protobuf sources
        run: |
          # Regenerate against this runner's protobuf@21 protoc (keg-only).
          PROTOC="$(brew --prefix protobuf@21)/bin/protoc"
          PROTO_SRC="vendor/twsapi/IBJts/source/proto"
          PROTO_OUT="vendor/twsapi/IBJts/source/cppclient/client/protobufUnix"
          mkdir -p "$PROTO_OUT"
          "$PROTOC" --proto_path="$PROTO_SRC" --cpp_out="$PROTO_OUT" "$PROTO_SRC"/*.proto

      - name: Cache build dependencies (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: macos-deps-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: macos-deps-

      - name: Configure
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix protobuf@21);$(brew --prefix)" \
            -DIBKR_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Install (binary + assets/) to dist/
        run: cmake --install build --prefix dist

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' || github.ref_name == 'fix/stability-review' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ibkr-trading-app-macos
          path: dist/
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'release' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          cache: true

      - name: Cache vcpkg installed packages
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x64-windows-static-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: vcpkg-x64-windows-static-

      - name: Install dependencies via vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: vcpkg install glfw3:x64-windows-static protobuf:x64-windows-static

      - name: Regenerate protobuf sources
        run: |
          # The vendored IB API is committed as source; regenerate the protobuf
          # against vcpkg's protoc so it matches this runner's libprotobuf.
          $protoc = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static\tools\protobuf\protoc.exe"
          $PROTO_SRC = (Resolve-Path "vendor/twsapi/IBJts/source/proto").Path
          $PROTO_OUT = "vendor/twsapi/IBJts/source/cppclient/client/protobufUnix"
          New-Item -ItemType Directory -Force -Path $PROTO_OUT | Out-Null
          $PROTO_OUT = (Resolve-Path $PROTO_OUT).Path
          Get-ChildItem $PROTO_SRC -Filter *.proto | ForEach-Object {
            & $protoc --cpp_out=$PROTO_OUT --proto_path=$PROTO_SRC $_.FullName
          }
        shell: pwsh

      - name: Cache build dependencies (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: windows-deps-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: windows-deps-

      - name: Configure
        run: >
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DIBKR_BUILD_TESTS=ON
        shell: pwsh

      - name: Build
        run: cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS
        shell: pwsh

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
        shell: pwsh

      - name: Install (binary + assets/) to dist/
        run: cmake --install build --config Release --prefix dist
        shell: pwsh

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' || github.ref_name == 'fix/stability-review' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ibkr-trading-app-windows
          path: dist/
          retention-days: 30

  # ── Sanitizer job (Linux only) ────────────────────────────────────────────
  # Builds tests-core with AddressSanitizer + UBSanitizer.
  # tests-ibkr is excluded here to avoid false positives from third-party IB
  # API code that we do not control.
  sanitize-linux:
    runs-on: ubuntu-latest
    needs: build-linux  # only run if the main Linux build passes

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            libvulkan-dev vulkan-validationlayers \
            libglfw3-dev \
            libprotobuf-dev protobuf-compiler \
            libgl1-mesa-dev

      # No TWS API step needed: this job builds only tests-core, which is pure
      # logic with no IB API / protobuf dependency.

      - name: Cache build dependencies (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: linux-deps-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: linux-deps-

      - name: Configure (Debug + ASan + UBSan on tests-core)
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DIBKR_BUILD_TESTS=ON \
            -DIBKR_SANITIZE=ON

      - name: Build tests-core only
        run: cmake --build build -j$(nproc) --target tests-core

      - name: Run tests-core with sanitizers
        run: |
          ASAN_OPTIONS=detect_leaks=0 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
          ./build/tests/tests-core
